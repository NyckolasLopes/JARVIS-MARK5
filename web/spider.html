<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Interface</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <header>
        <h1>JARVIS</h1>
        <div class="status-container">
            <div class="status-indicator"></div>
            <span id="status">System Starting...</span>
        </div>
    </header>

    <div class="main-container">
        <!-- Animated Core Visualizer -->
        <div class="visualizer-container">
            <div class="jarvis-core">
                <div class="core-inner"></div>
            </div>
        </div>

        <!-- Chat History -->
        <div class="chat-container">
            <div class="chat-header">COMMUNICATION LOG</div>
            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>
        </div>
    </div>

    <!-- Bottom Control Panel -->
    <div class="controls">
        <button onclick="startListening()">Start Listening</button>
        <button class="danger" onclick="stopListening()">Stop Listening</button>
        <button onclick="startVideo()">Start Video</button>
        <button class="danger" onclick="stopVideo()">Stop Video</button>
        <button onclick="captureImage()">Capture Image</button>
    </div>

    <script>
        // Store previous messages to prevent duplicate rendering
        let lastMessageCount = 0;

        // Update status
        async function updateStatus() {
            const status = await eel.js_state()();
            document.getElementById('status').textContent = `STATUS: ${status}`;
        }

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false; // Stop after each sentence to process
            recognition.interimResults = false;
            recognition.lang = 'pt-BR'; // Since the environment InputLanguage is pt-br

            recognition.onstart = function() {
                isListening = true;
                eel.js_state("Listening...")();
                document.getElementById('status').textContent = "STATUS: Listening...";
                // Make the core pulse faster when listening
                document.querySelector('.core-inner').style.animation = "core-pulse 0.5s ease-in-out infinite alternate";
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                console.log("Recognized:", transcript);
                // Send the real spoken text to Python
                eel.js_mic(transcript);
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error:", event.error);
                stopListening();
            };

            recognition.onend = function() {
                isListening = false;
                // If it should continuously listen, we can restart it here.
                // For now, we wait for processing, Python will set state to "Thinking..."
                document.querySelector('.core-inner').style.animation = "core-pulse 3s ease-in-out infinite alternate";
            };
        } else {
            console.error("Speech Recognition API not supported in this browser.");
        }

        // Start listening
        function startListening() {
            if (recognition && !isListening) {
                recognition.start();
            } else if (!recognition) {
                // Fallback for unsupported browsers
                eel.js_mic("Hello JARVIS");
            }
        }

        // Stop listening
        function stopListening() {
            if (recognition && isListening) {
                recognition.stop();
            }
            eel.js_state("Available...")();
            document.querySelector('.core-inner').style.animation = "core-pulse 3s ease-in-out infinite alternate";
        }

        // Start video
        function startVideo() {
            eel.python_call_to_start_video();
        }

        // Stop video
        function stopVideo() {
            eel.python_call_to_stop_video();
        }

        // Capture image
        function captureImage() {
            eel.python_call_to_capture();
        }

        // Handle captured image
        eel.expose(handleCapturedImage);
        function handleCapturedImage(imageData) {
            eel.handle_captured_image(imageData);
        }

        // Update messages with styling
        async function updateMessages() {
            const newMessages = await eel.js_messages()();
            const messagesDiv = document.getElementById('messages');
            
            // Only add new messages
            if (newMessages.length > lastMessageCount) {
                for (let i = lastMessageCount; i < newMessages.length; i++) {
                    const msg = newMessages[i];
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `msg ${msg.role === 'user' ? 'msg-user' : 'msg-jarvis'}`;
                    
                    const roleDiv = document.createElement('div');
                    roleDiv.className = 'msg-role';
                    roleDiv.textContent = msg.role;
                    
                    const contentDiv = document.createElement('div');
                    contentDiv.textContent = msg.content;
                    
                    msgDiv.appendChild(roleDiv);
                    msgDiv.appendChild(contentDiv);
                    messagesDiv.appendChild(msgDiv);
                }
                
                // Auto-scroll to bottom
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                lastMessageCount = newMessages.length;
            }
        }

        // Setup
        eel.setup();

        // Update status and messages every second
        setInterval(() => {
            updateStatus();
            updateMessages();
        }, 1000);
    </script>
</body>
</html>
