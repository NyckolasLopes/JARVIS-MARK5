<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Interface</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <!-- Startup Overlay to bypass browser security -->
    <div id="startup-overlay" onclick="startSystem()">
        <div class="startup-text">SYSTEM OFFLINE - CLICK TO POWER ON</div>
    </div>

    <header>
        <h1>JARVIS</h1>
    </header>

    <div class="main-container">
        <!-- Animated Core Visualizer -->
        <div class="visualizer-container">
            <div class="core-wrapper">
                <div class="jarvis-core">
                    <canvas id="particleCanvas"></canvas>
                </div>
                <div class="status-container">
                    <div class="status-indicator"></div>
                    <span id="status">System Starting...</span>
                </div>
            </div>
        </div>

        <!-- Chat History -->
        <div class="chat-container">
            <div class="chat-header">COMMUNICATION LOG</div>
            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>
        </div>
    </div>



    <script>
        // Store previous messages to prevent duplicate rendering
        let lastMessageCount = 0;
        let systemStarted = false;

        function startSystem() {
            document.getElementById('startup-overlay').style.display = 'none';
            systemStarted = true;
            if (recognition && !isListening) {
                try { recognition.start(); } catch(e) {}
            }
        }

        // Update status and control automatic listening
        async function updateStatus() {
            const status = await eel.js_state()();
            document.getElementById('status').textContent = `STATUS: ${status}`;

            // Automatic Hands-Free Listening Logic
            if (systemStarted && status === "Available..." && !isListening && recognition) {
                try {
                    recognition.start();
                } catch(e) { }
            } else if (status !== "Available..." && status !== "Listening..." && isListening && recognition) {
                try {
                    recognition.stop();
                } catch(e) { }
            }
        }

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false; // Stop after each sentence to process
            recognition.interimResults = false;
            recognition.lang = 'pt-BR'; // Since the environment InputLanguage is pt-br

            recognition.onstart = function() {
                isListening = true;
                eel.js_state("Listening...")();
                document.getElementById('status').textContent = "STATUS: Listening...";
                // Make the core pulse faster when listening
                document.querySelector('.core-inner').style.animation = "core-pulse 0.5s ease-in-out infinite alternate";
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                console.log("Recognized:", transcript);
                // Send the real spoken text to Python
                eel.js_mic(transcript);
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error:", event.error);
                stopListening();
            };

            recognition.onend = function() {
                isListening = false;
                // If it should continuously listen, we can restart it here.
                // For now, we wait for processing, Python will set state to "Thinking..."
                document.querySelector('.core-inner').style.animation = "core-pulse 3s ease-in-out infinite alternate";
            };
        } else {
            console.error("Speech Recognition API not supported in this browser.");
        }

        // Start listening
        function startListening() {
            if (recognition && !isListening) {
                recognition.start();
            } else if (!recognition) {
                // Fallback for unsupported browsers
                eel.js_mic("Hello JARVIS");
            }
        }

        // Stop listening
        function stopListening() {
            if (recognition && isListening) {
                recognition.stop();
            }
            eel.js_state("Available...")();
            document.querySelector('.core-inner').style.animation = "core-pulse 3s ease-in-out infinite alternate";
        }

        // Start video
        function startVideo() {
            eel.python_call_to_start_video();
        }

        // Stop video
        function stopVideo() {
            eel.python_call_to_stop_video();
        }

        // Capture image
        function captureImage() {
            eel.python_call_to_capture();
        }

        // Handle captured image
        eel.expose(handleCapturedImage);
        function handleCapturedImage(imageData) {
            eel.handle_captured_image(imageData);
        }

        // Update messages with styling
        async function updateMessages() {
            const newMessages = await eel.js_messages()();
            const messagesDiv = document.getElementById('messages');
            
            // Only add new messages
            if (newMessages.length > lastMessageCount) {
                for (let i = lastMessageCount; i < newMessages.length; i++) {
                    const msg = newMessages[i];
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `msg ${msg.role === 'user' ? 'msg-user' : 'msg-jarvis'}`;
                    
                    const roleDiv = document.createElement('div');
                    roleDiv.className = 'msg-role';
                    roleDiv.textContent = msg.role;
                    
                    const contentDiv = document.createElement('div');
                    contentDiv.textContent = msg.content;
                    
                    msgDiv.appendChild(roleDiv);
                    msgDiv.appendChild(contentDiv);
                    messagesDiv.appendChild(msgDiv);
                }
                
                // Auto-scroll to bottom
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                lastMessageCount = newMessages.length;
            }
        }

        // Setup
        eel.setup();

        // Update status and messages every second
        setInterval(() => {
            updateStatus();
            updateMessages();
        }, 1000);

        // 3D Particle Sphere Animation
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = 300;
        let height = canvas.height = 300;
        let particles = [];
        
        // Adjust these to change the look of the sphere
        const numParticles = 400;
        const baseRadius = 80;
        const perspective = 300;
        
        let targetScale = 1.0;
        let currentScale = 1.0;
        let time = 0;
        
        class Particle {
            constructor() {
                // Random position on a unit sphere
                const theta = Math.random() * 2 * Math.PI;
                const phi = Math.acos(Math.random() * 2 - 1);
                
                this.x = Math.sin(phi) * Math.cos(theta);
                this.y = Math.sin(phi) * Math.sin(theta);
                this.z = Math.cos(phi);
                
                // Rotation speeds (slower as requested)
                this.rx = (Math.random() - 0.5) * 0.01;
                this.ry = (Math.random() - 0.5) * 0.01;
                this.rz = (Math.random() - 0.5) * 0.01;
                
                this.size = Math.random() * 2.5 + 1;
                this.baseAlpha = Math.random() * 0.6 + 0.4;
            }
            
            update(isActive) {
                // Slower rotation
                const speedMult = isActive ? 1.5 : 0.4;
                
                // Y rotation
                let cosY = Math.cos(this.ry * speedMult);
                let sinY = Math.sin(this.ry * speedMult);
                let newX = this.x * cosY - this.z * sinY;
                let newZ = this.z * cosY + this.x * sinY;
                this.x = newX;
                this.z = newZ;
                
                // Z rotation
                let cosZ = Math.cos(this.rz * speedMult);
                let sinZ = Math.sin(this.rz * speedMult);
                newX = this.x * cosZ - this.y * sinZ;
                let newY = this.y * cosZ + this.x * sinZ;
                this.x = newX;
                this.y = newY;
            }
            
            draw(radiusMult) {
                // Apply base radius and current animation scale multiplier
                const sx = this.x * baseRadius * radiusMult;
                const sy = this.y * baseRadius * radiusMult;
                const sz = this.z * baseRadius * radiusMult;
                
                // Project 3D to 2D
                const scale = perspective / (perspective + sz);
                const projectedX = sx * scale + width / 2;
                const projectedY = sy * scale + height / 2;
                
                if (sz < perspective) {
                    ctx.beginPath();
                    ctx.arc(projectedX, projectedY, this.size * scale, 0, Math.PI * 2);
                    // White color
                    const alpha = Math.max(0, this.baseAlpha * scale);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fill();
                    ctx.shadowBlur = 15 * scale;
                    ctx.shadowColor = '#ffffff';
                }
            }
        }
        
        for(let i=0; i<numParticles; i++) {
            particles.push(new Particle());
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Check status for animations
            // Note: The status container is hidden via CSS, but we can still read its text!
            const statusText = document.getElementById('status').textContent;
            
            if (statusText.includes("Listening")) {
                targetScale = 1.6; // Expands when waiting for user to speak
            } else {
                targetScale = 1.0; // Normal size when thinking or idle
            }
            
            // Smoothly interpolate the scale
            currentScale += (targetScale - currentScale) * 0.05;
            
            // Add a slow breathing oscillation effect
            time += 0.03;
            const breathingScale = currentScale + Math.sin(time) * 0.08;
            
            const isActive = statusText.includes("Thinking") || statusText.includes("Listening");
            
            particles.forEach(p => {
                p.update(isActive);
                p.draw(breathingScale);
            });
            requestAnimationFrame(animate);
        }
        animate();
        
    </script>
</body>
</html>
